# Runs on every `git commit` once installed with `uv run pre-commit install`.
# Ruff and mypy run through uv, so they use exactly the versions pinned in uv.lock.
# Golden files in tests/data must stay byte-for-byte as the exporters wrote them.
exclude: ^tests/data/
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint + autofix)
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (type check)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        files: ^src/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: [--maxkb=1024]
