[project]
name = "easy-mask"
version = "0.1.0"
description = "Local-first image annotation for computer-vision masks: polygons, boxes, circles today; SAM2 next."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Dharun235" }]
keywords = ["annotation", "segmentation", "computer-vision", "mask", "labeling", "sam2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=2.0",
    "opencv-contrib-python-headless>=5.0.0.93",
    "pillow>=10.0",
    "PySide6>=6.7",
]

[project.optional-dependencies]
# Video mask propagation (EfficientTAM / SAM 2.1). Heavy: pulls in PyTorch.
video = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "hydra-core>=1.3.2",
    "efficient-track-anything",
    "sam-2",
]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2" }
efficient-track-anything = { git = "https://github.com/yformer/EfficientTAM" }

# EfficientTAM declares its Gradio demo's dependencies (gradio, moviepy, opencv-python, ...),
# which would downgrade Pillow and add a second OpenCV. The model code only needs these.
[[tool.uv.dependency-metadata]]
name = "efficient-track-anything"
version = "1.0"
requires-dist = ["torch", "torchvision", "numpy", "hydra-core", "iopath", "pillow", "tqdm"]

[project.urls]
Repository = "https://github.com/Dharun235/easy-mask"
Issues = "https://github.com/Dharun235/easy-mask/issues"

[project.scripts]
easy-mask = "easy_mask.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.4",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_mask"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "N",        # pep8-naming
    "D",        # pydocstyle (docstrings required)
    "RUF",      # ruff-specific
]
ignore = [
    "D105",  # magic methods need no docstring
    "D107",  # __init__ documented on the class
    "N802",  # Qt overrides use camelCase (paintEvent, mousePressEvent, ...)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D100", "D103"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
# Optional `video` extra: untyped, and absent in the base install.
module = ["torch.*", "hydra.*", "omegaconf.*", "sam2.*", "efficient_track_anything.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
# importlib mode: test files in different folders may share a basename.
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["."]  # lets tests import the top-level benchmarks package
# Every test gets the marker of its folder (see tests/conftest.py), so you can run
# one layer at a time, e.g. `uv run pytest -m unit` or `-m "not gui and not slow"`.
markers = [
    "unit: fast, isolated tests of one function or class (tests/unit)",
    "integration: several modules together, real files on disk (tests/integration)",
    "gui: drive the Qt window with real mouse/key events, headless (tests/gui)",
    "property: property-based tests with Hypothesis (tests/property)",
    "architecture: enforce layering and project rules (tests/architecture)",
    "smoke: does the installed app start at all, in a subprocess (tests/smoke)",
    "slow: takes more than a second; skipped with -m 'not slow'",
    "benchmark: needs downloaded benchmark data in data/benchmarks; skipped otherwise",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["easy_mask"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = [
    "if __name__ == .__main__.:",
]
